services:
  # Backend API — Node/Express + SQLite on a persistent disk
  - type: web
    name: greenmoney-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DB_DIR
        value: /var/data
      - key: FRONTEND_URL
        sync: false # set manually once the frontend URL is known (step in guide)
    disk:
      name: greenmoney-data
      mountPath: /var/data
      sizeGB: 1

  # Frontend — static React build
  - type: web
    name: greenmoney-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set manually to the backend URL (step in guide)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
